name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests (no AMD key needed; the model call is stubbed)
        run: python -m pytest -q backend/tests
      - name: Saved checker reports match the checker and inputs
        run: PYTHONPATH=backend python -m app.checker_report --check
      - name: Planning regressions
        run: cd plan/prototype && python regression_checks.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Add harmless canaries to verify environment files stay outside the image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for directory in ("backend/app", "frontend/public", "shared"):
              (Path(directory) / ".env.docker-canary").write_text("BUILD_CONTEXT_CANARY=not-a-secret\n")
          PY
      - name: Build the production UI and API image
        run: docker build --tag rehearsal:ci .
      - name: Check the runtime package
        run: |
          docker run --rm --entrypoint python rehearsal:ci -c '
          import importlib.util, os, pathlib, shutil
          assert os.getuid() == 1000
          assert shutil.which("node") is None
          assert importlib.util.find_spec("pytest") is None
          for path in ("/app/.git", "/app/.env", "/app/backend/.env", "/app/frontend/node_modules",
                       "/app/backend/app/.env.docker-canary", "/app/backend/static/.env.docker-canary",
                       "/app/shared/.env.docker-canary"):
              assert not pathlib.Path(path).exists(), path
          '
      - name: Check strict mode without AMD credentials
        run: |
          docker run --detach --init --name rehearsal-strict \
            --publish 127.0.0.1:17860:7860 rehearsal:ci
          python3 scripts/container_smoke.py http://127.0.0.1:17860 --mode strict
      - name: Check the full offline workflow on a custom port
        run: |
          docker run --detach --init --name rehearsal-fallback \
            --publish 127.0.0.1:17861:8080 \
            --env PORT=8080 --env WEB_CONCURRENCY=4 \
            --env ALLOW_RULE_FALLBACK=1 rehearsal:ci
          python3 scripts/container_smoke.py http://127.0.0.1:17861 --mode fallback
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs rehearsal-strict 2>&1 || true
          docker logs rehearsal-fallback 2>&1 || true
          docker rm --force rehearsal-strict rehearsal-fallback 2>/dev/null || true
